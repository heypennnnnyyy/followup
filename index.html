<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>記帳本</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--sub:#86868b;--ac:#0a84ff;--bd:#e5e5ea;--red:#ff453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989f;--bd:#38383a}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989f;--bd:#38383a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,"PingFang TC",sans-serif;padding:16px;max-width:480px;margin:auto}
h1{font-size:24px;margin:8px 0 12px}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}label:first-child{margin-top:0}
input,select{width:100%;font-size:17px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input,select{display:block;min-height:46px;-webkit-appearance:none;appearance:none;text-align:left;margin:0}
input[type=date]{min-width:100%;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
button{font-size:17px;border:0;border-radius:12px;padding:13px;width:100%;background:var(--ac);color:#fff;margin-top:14px}
button.g{background:var(--bg);color:var(--ac);border:1px solid var(--bd)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.cats span{padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:14px}.cats span.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row small{color:var(--sub);display:block;font-size:12px}.row b{font-variant-numeric:tabular-nums}
.x{color:var(--red);background:none;width:auto;padding:4px 10px;margin:0;font-size:20px}
.bar{height:8px;border-radius:4px;background:var(--ac);margin-top:3px}
.tot{font-size:30px;font-weight:700}.sub{color:var(--sub);font-size:13px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}
</style></head><body>
<h1>💰 記帳本</h1>
<div class="card">
<label>日期</label><input type="date" id="d">
<label>金額</label><input type="number" id="a" inputmode="decimal" placeholder="例如 120">
<label>購買物品</label><input id="i" placeholder="例如 午餐便當、捷運、電費">
<label>分類（會依物品自動判斷，可點選修改）</label><div class="cats" id="cats"></div>
<label>刷卡銀行</label><select id="b"></select>
<button id="save">儲存這筆</button>
</div>
<div class="card"><div class="sub" id="mlabel"></div><div class="tot" id="tot"></div><div id="stat"></div></div>
<div class="card"><b>本月紀錄</b><div id="list"></div></div>
<div class="card"><b>跨月規則</b><div class="sub">指定銀行的消費，在某號（含）之後會算進次月報表。</div>
<label>刷卡銀行</label><select id="rb"></select><label>算入次月的日期</label><select id="rd"><option value="0">當月最後一天（自動判斷28/29/30/31）</option><option value="1">1 號（含）之後</option><option value="2">2 號（含）之後</option><option value="3">3 號（含）之後</option><option value="4">4 號（含）之後</option><option value="5">5 號（含）之後</option><option value="6">6 號（含）之後</option><option value="7">7 號（含）之後</option><option value="8">8 號（含）之後</option><option value="9">9 號（含）之後</option><option value="10">10 號（含）之後</option><option value="11">11 號（含）之後</option><option value="12">12 號（含）之後</option><option value="13">13 號（含）之後</option><option value="14">14 號（含）之後</option><option value="15">15 號（含）之後</option><option value="16">16 號（含）之後</option><option value="17">17 號（含）之後</option><option value="18">18 號（含）之後</option><option value="19">19 號（含）之後</option><option value="20">20 號（含）之後</option><option value="21">21 號（含）之後</option><option value="22">22 號（含）之後</option><option value="23">23 號（含）之後</option><option value="24">24 號（含）之後</option><option value="25">25 號（含）之後</option><option value="26">26 號（含）之後</option><option value="27">27 號（含）之後</option><option value="28">28 號（含）之後</option><option value="29">29 號（含）之後</option><option value="30" selected>30 號（含）之後</option><option value="31">31 號（含）之後</option></select>
<button class="g" id="rs">儲存規則</button><button class="g" id="rc">清除這間銀行的規則</button><div id="rl" style="margin-top:8px"></div></div>
<div class="card"><button class="g" id="exp" style="margin:0">📧 匯出當月帳本並寄信</button>
<div class="sub" style="margin-top:8px">會呼叫捷徑「寄出帳本」寄到你的信箱，寄出後再詢問是否刪除當月紀錄。</div>
<button class="g" id="copy">複製 CSV（備用）</button></div>
<div id="toast"></div>
<script>
var CATS=["餐飲","交通","購物","日用品","娛樂","醫療","帳單","小波","其他"];
var KW={"餐飲":"早餐 午餐 晚餐 宵夜 咖啡 飲料 便當 麵 飯 茶 餐 麥當勞 超商 手搖 火鍋 水果 零食","交通":"捷運 公車 高鐵 台鐵 加油 停車 uber 計程車 悠遊卡 機票 etag","購物":"衣 褲 鞋 蝦皮 momo 包 手機 配件 禮物","日用品":"衛生紙 洗 牙膏 全聯 家樂福 costco 日用","娛樂":"電影 遊戲 netflix spotify ktv 演唱會 旅遊 訂閱","醫療":"藥 診所 醫 掛號 牙 健檢","帳單":"水費 電費 房租 電信 網路 瓦斯 保險 稅 手續費"};
var BANKS=["國泰世華","中國信託","玉山","台新","富邦","永豐","聯邦","第一銀行","兆豐","華南","現金/其他"];
var S={rec:[],map:{},rules:{}},cat="其他";
function eff(r){var m=r.date.slice(0,7),d=parseInt(r.date.slice(8,10),10),c=S.rules[r.bank];
var L=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
if(c!==undefined&&(c===0?d==L:d>=c)){var y=+m.slice(0,4),n=+m.slice(5,7)+1;if(n>12){n=1;y++}return y+"-"+("0"+n).slice(-2)}return m}
function drawRules(){var h="",k;for(k in S.rules)h+='<div class="row"><span>'+k+"："+S.rules[k]+" 號（含）之後算次月</span></div>";
$("rl").innerHTML=h||'<div class="sub">尚未設定</div>';$("rb").innerHTML=BANKS.map(function(b){return"<option>"+b+"</option>"}).join("")}
function ld(){try{S.rec=JSON.parse(localStorage.getItem("rec")||"[]");S.map=JSON.parse(localStorage.getItem("map")||"{}");S.rules=JSON.parse(localStorage.getItem("rules")||"{}")}catch(e){}}
function sv(){try{localStorage.setItem("rec",JSON.stringify(S.rec));localStorage.setItem("map",JSON.stringify(S.map));localStorage.setItem("rules",JSON.stringify(S.rules))}catch(e){toast("無法儲存，請檢查瀏覽器設定")}}
var $=function(x){return document.getElementById(x)};
function toast(t){var e=$("toast");e.textContent=t;e.style.opacity=1;setTimeout(function(){e.style.opacity=0},2200)}
function today(){var n=new Date();return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2)}
function guess(t){t=t.toLowerCase().trim();if(!t)return"其他";if(S.map[t])return S.map[t];
for(var c in KW){var w=KW[c].split(" ");for(var k=0;k<w.length;k++)if(t.indexOf(w[k])>-1)return c}return"其他"}
function drawCats(){$("cats").innerHTML="";CATS.forEach(function(c){var s=document.createElement("span");s.textContent=c;if(c==cat)s.className="on";s.onclick=function(){cat=c;drawCats()};$("cats").appendChild(s)})}
function add(r){S.rec.push(r);var k=r.item.toLowerCase().trim();if(k)S.map[k]=r.cat;sv()}
function render(){var m=today().slice(0,7),rs=S.rec.filter(function(r){return eff(r)==m}).sort(function(a,b){return b.date<a.date?-1:1});
var t=0,by={};rs.forEach(function(r){t+=r.amt;by[r.cat]=(by[r.cat]||0)+r.amt});
$("mlabel").textContent=m.replace("-","年")+"月 支出合計";$("tot").textContent="$"+t.toLocaleString();
var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
$("stat").innerHTML=ks.map(function(k){return'<div style="margin-top:8px"><span class="sub">'+k+"　$"+by[k].toLocaleString()+'</span><div class="bar" style="width:'+Math.round(by[k]/t*100)+'%"></div></div>'}).join("");
$("list").innerHTML="";if(!rs.length)$("list").innerHTML='<div class="sub" style="padding:10px 0">還沒有紀錄</div>';
rs.forEach(function(r){var d=document.createElement("div");d.className="row";var l=document.createElement("div");var n=document.createElement("span");n.textContent=r.item;var s=document.createElement("small");s.textContent=r.date.slice(5)+"・"+r.cat+"・"+r.bank;l.appendChild(n);l.appendChild(s);
var b=document.createElement("b");b.textContent="$"+r.amt.toLocaleString();var x=document.createElement("button");x.className="x";x.textContent="×";x.onclick=function(){if(confirm("刪除「"+r.item+"」？")){S.rec.splice(S.rec.indexOf(r),1);sv();render()}};
var rt=document.createElement("div");rt.style.display="flex";rt.style.alignItems="center";rt.appendChild(b);rt.appendChild(x);d.appendChild(l);d.appendChild(rt);$("list").appendChild(d)})}
function csv(){var m=today().slice(0,7),rs=S.rec.filter(function(r){return eff(r)==m}).sort(function(a,b){return a.date<b.date?-1:1}),t=0;
var q=function(v){return'"'+String(v).replace(/"/g,'""')+'"'};var o=["日期,金額,購買物品,分類,刷卡銀行"];
rs.forEach(function(r){t+=r.amt;o.push([r.date,r.amt,q(r.item),r.cat,q(r.bank)].join(","))});o.push("合計,"+t);return{text:m+" 月帳本（共"+rs.length+"筆）\n"+o.join("\n"),n:rs.length}}
$("rs").onclick=function(){var d=parseInt($("rd").value,10);if(isNaN(d)){return}S.rules[$("rb").value]=d;sv();drawRules();render();toast("已儲存規則")};
$("rc").onclick=function(){delete S.rules[$("rb").value];sv();drawRules();render();toast("已清除")};
$("i").oninput=function(){cat=guess($("i").value);drawCats()};
$("save").onclick=function(){var a=parseFloat($("a").value),i=$("i").value.trim();if(!a||!i){toast("請填金額和物品");return}
add({date:$("d").value||today(),amt:a,item:i,cat:cat,bank:$("b").value});$("a").value="";$("i").value="";cat="其他";drawCats();render();toast("已儲存 ✓")};
$("exp").onclick=function(){var c=csv();if(!c.n){toast("本月沒有紀錄");return}
location.href="shortcuts://run-shortcut?name="+encodeURIComponent("寄出帳本")+"&input=text&text="+encodeURIComponent(c.text);
setTimeout(function(){if(confirm("信件已寄出並收到了嗎？\n按「確定」會刪除本月 "+c.n+" 筆紀錄。")){var m=today().slice(0,7);S.rec=S.rec.filter(function(r){return eff(r)!=m});sv();render();toast("已清除當月紀錄")}},4000)};
$("copy").onclick=function(){var t=csv().text;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("已複製")},function(){prompt("請手動複製：",t)})};
(function(){ld();$("d").value=today();$("b").innerHTML=BANKS.map(function(b){return"<option>"+b+"</option>"}).join("");
var p=new URLSearchParams(location.search);if(p.get("date"))$("d").value=p.get("date");if(p.get("amount"))$("a").value=p.get("amount");if(p.get("item")){$("i").value=p.get("item");cat=guess(p.get("item"))}
if(p.get("bank"))$("b").value=p.get("bank");drawCats();drawRules();render();
if(p.get("auto")=="1"&&parseFloat(p.get("amount"))&&p.get("item")){$("save").click();history.replaceState(null,"",location.pathname)}})();
</script></body></html>
