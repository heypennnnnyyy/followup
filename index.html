<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>術後回診時間計算</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1c2430;--muted:#667085;--accent:#0f766e;--accent-bg:#e6f4f2;--line:#d8dee4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b222b;--text:#eef2f6;--muted:#9aa6b2;--accent:#5eead4;--accent-bg:#17302e;--line:#2d3743;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b222b;--text:#eef2f6;--muted:#9aa6b2;--accent:#5eead4;--accent-bg:#17302e;--line:#2d3743;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=date]{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);min-height:48px}
.row{margin-bottom:14px}.row:last-child{margin-bottom:0}
.today{margin-top:8px;font-size:14px;color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer}
.big{text-align:center;background:var(--accent-bg);border-radius:12px;padding:18px 10px;margin-bottom:12px}
.big .n{font-size:44px;font-weight:700;color:var(--accent);line-height:1.1}
.big .l{font-size:14px;color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:10px}
.item:first-of-type{border-top:0}
.item span{color:var(--muted);font-size:14px}
.item b{font-size:19px;text-align:right}
.msg{text-align:center;color:var(--muted);padding:8px}
.err{color:#d92d20}
.foot{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
<h1>術後回診時間計算</h1>
<div class="card">
  <div class="row">
    <label for="op">手術日期</label>
    <input type="date" id="op">
  </div>
  <div class="row">
    <label for="fu">回診日期</label>
    <input type="date" id="fu">
    <button class="today" id="today" type="button">設為今天</button>
  </div>
</div>
<div class="card" id="out"><div class="msg">請選擇手術日期</div></div>
<p class="foot">資料只在您的瀏覽器計算，不會儲存或上傳。</p>
</main>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){const[a,b,c]=s.split("-").map(Number);return{y:a,m:b,d:c};}
function utc(y,m,d){return Date.UTC(y,m-1,d);}
function daysInMonth(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}
// 從手術日往後加 n 個月（月底自動對齊，如 1/31 + 1 月 = 2/28）
function addMonths(s,n){const t=s.y*12+(s.m-1)+n;const y=Math.floor(t/12),m=t%12+1;return utc(y,m,Math.min(s.d,daysInMonth(y,m)));}
function calc(){
  const o=$("op").value,f=$("fu").value,out=$("out");
  if(!o||!f){out.innerHTML='<div class="msg">請選擇手術日期與回診日期</div>';return;}
  const a=parse(o),b=parse(f);
  const total=Math.round((utc(b.y,b.m,b.d)-utc(a.y,a.m,a.d))/86400000);
  if(total<0){out.innerHTML='<div class="msg err">回診日期不能早於手術日期</div>';return;}
  let months=(b.y-a.y)*12+(b.m-a.m);
  if(addMonths(a,months)>utc(b.y,b.m,b.d))months--;
  const rest=Math.round((utc(b.y,b.m,b.d)-addMonths(a,months))/86400000);
  const yrs=Math.floor(months/12),mo=months%12;
  const wk=Math.floor(rest/7),dd=rest%7;
  const mw=(months?months+" 個月 ":"")+(wk?wk+" 週 ":"")+(dd||(!months&&!wk)?dd+" 天":"");
  const ym=(yrs?yrs+" 年 ":"")+(mo?mo+" 個月 ":"")+(rest||(!yrs&&!mo)?rest+" 天":"");
  const w=Math.floor(total/7),wd=total%7;
  out.innerHTML=
   '<div class="big"><div class="n">'+total+'</div><div class="l">術後總天數</div></div>'+
   '<div class="item"><span>幾個月幾週</span><b>'+mw.trim()+'</b></div>'+
   '<div class="item"><span>幾年幾個月</span><b>'+ym.trim()+'</b></div>'+
   '<div class="item"><span>總週數</span><b>'+w+' 週'+(wd?' '+wd+' 天':'')+'</b></div>';
}
$("fu").value=todayStr();
$("today").onclick=()=>{$("fu").value=todayStr();calc();};
$("op").oninput=calc;$("fu").oninput=calc;
calc();
</script>
</body>
</html>
